project_id = "vc-imob-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "https://valdineycapistranoimoveis.com.br/crm/"
additional_redirect_urls = ["https://valdineycapistranoimoveis.com.br/crm/", "https://valdineycapistranoimoveis.com.br/crm/confirm.html", "https://valdineycapistranoimoveis.com.br/crm/login.html", "http://127.0.0.1:3000", "http://127.0.0.1:3000/crm/confirm.html", "http://localhost:3000", "http://localhost:3000/crm/confirm.html"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Confirme seu e-mail | VC Imob"
content_path = "./supabase/templates/confirmation.html"

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.site-lead]
enabled = true
verify_jwt = false
entrypoint = "./functions/site-lead/index.ts"

[functions.property-ad]
enabled = true
verify_jwt = false
entrypoint = "./functions/property-ad/index.ts"

[functions.billing-provider-event]
enabled = true
verify_jwt = false
entrypoint = "./functions/billing-provider-event/index.ts"
