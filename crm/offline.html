<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <title>Sem conexão | VC Imob</title>
  <link rel="stylesheet" href="./css/crm.css">
  <link rel="stylesheet" href="./css/phase-g.css">
</head>
<body class="crm-login-page crm-offline-page">
  <main class="login-shell">
    <section class="login-panel" aria-labelledby="offlineTitle">
      <span class="crm-brand"><span>VC</span><strong>Imob</strong></span>
      <p class="eyebrow">Conexão indisponível</p>
      <h1 id="offlineTitle">Você está sem conexão.</h1>
      <p class="muted">Por segurança, dados de clientes não são armazenados para uso offline. Reconecte-se para atualizar e operar o CRM.</p>
      <button class="crm-button crm-button-primary" type="button" onclick="window.location.reload()">Tentar novamente</button>
    </section>
  </main>
</body>
</html>
