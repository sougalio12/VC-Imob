<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Entrar | VC Imob</title>
  <meta name="theme-color" content="#0b0b0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VC Imob">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/crm.css">
  <link rel="stylesheet" href="./css/phase-g.css?v=phase-g-20260902">
</head>
<body class="crm-login-page">
  <main class="login-shell">
    <section class="login-panel">
      <a class="crm-brand" href="../index.html"><span>VC</span><strong>Imob</strong></a>
      <p class="eyebrow">Área administrativa</p>
      <h1>Gerencie seus leads e negociações.</h1>
      <p class="muted">Entre com sua conta do Supabase ou use a demonstração, que não armazena dados permanentemente.</p>
      <form id="loginForm" class="crm-form" novalidate>
        <label>E-mail<input type="email" name="email" autocomplete="email" required></label>
        <label>Senha<input type="password" name="password" autocomplete="current-password" required minlength="6"></label>
        <p id="loginError" class="form-error" role="alert"></p>
        <button class="crm-button crm-button-primary" type="submit">Entrar</button>
      </form>
      <div class="login-divider"><span>ou</span></div>
      <button id="demoLoginButton" class="crm-button crm-button-outline" type="button">Entrar em modo demonstração</button>
      <p id="configHint" class="login-hint"></p>
    </section>
  </main>
  <script src="./js/config.js"></script>
  <script src="./js/supabase.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/native.js?v=phase-h-20260903"></script>
  <script src="./js/pwa.js?v=phase-g-20260902b"></script>
  <script>
    (async () => { if (isDemoMode() || await getValidSession()) window.location.replace('./index.html'); })();
    const form = document.getElementById('loginForm');
    const error = document.getElementById('loginError');
    document.getElementById('configHint').textContent = isSupabaseConfigured() ? '' : 'Modo demonstração disponível: configure o Supabase para habilitar o login real.';
    form.addEventListener('submit', async event => {
      event.preventDefault(); error.textContent = '';
      if (!isSupabaseConfigured()) { error.textContent = 'Configure SUPABASE_URL e a Publishable Key para usar o login real.'; return; }
      const data = new FormData(form);
      try { await signInWithPassword(data.get('email').trim(), data.get('password')); window.location.replace('./index.html'); }
      catch (err) { error.textContent = err.message || 'Não foi possível entrar.'; }
    });
    document.getElementById('demoLoginButton').addEventListener('click', () => { enterDemoMode(); window.location.replace('./index.html'); });
  </script>
</body>
</html>
